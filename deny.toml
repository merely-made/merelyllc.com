# cargo-deny configuration for mer3ly.
#
#   cargo deny check bans
#
# Two versions of one crate in a build are a defect: move the older version's
# holder forward. No duplicates: latest releases, or a skip below saying who
# holds the older one and what removes it (Mark, 2026-11-12). One entry per
# older version; delete an entry when its holder moves, and
# `cargo deny check bans` will name any that no longer match.

[graph]
all-features = true

[bans]
multiple-versions = "deny"
wildcards = "allow"

[[bans.skip]]
crate = "block-buffer@0.10.4"
reason = "held by digest 0.10.7 under sha2 0.10.9 (mer3ly-site, mer3ly-repo-graph); gone with it"

[[bans.skip]]
crate = "cpufeatures@0.2.17"
reason = "held by sha2 0.10.9 (mer3ly-site, mer3ly-repo-graph); gone with it"

[[bans.skip]]
crate = "crypto-common@0.1.7"
reason = "held by digest 0.10.7 under sha2 0.10.9 (mer3ly-site, mer3ly-repo-graph); gone with it"

[[bans.skip]]
crate = "digest@0.10.7"
reason = "held by sha2 0.10.9 (mer3ly-site, mer3ly-repo-graph); gone with it"

[[bans.skip]]
