[package]
name = "mer3ly-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Static Mer3ly site builder and public repository authority."
repository = "https://github.com/merely-made/merelyllc.com"
license = "MPL-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "authority"
path = "src/bin/authority.rs"

[[bin]]
name = "site"
path = "src/main.rs"

[dependencies]
cambium = "0.3.3"
# The /repos/ frozen first view (Ruling 157): the default matrix through the
# shared two-reading-matrix adapter (S2), and the default reading's capture
# decoded for the frozen reader. Native only, as graphshell-client is.
cartography = { package = "mere-cartography", git = "https://github.com/merely-made/mere.git", rev = "17519aa4b76f9fa37577d1bb9cbfb46c6bf4ae65" }
chirograph = { git = "https://github.com/merely-made/mere.git", rev = "17519aa4b76f9fa37577d1bb9cbfb46c6bf4ae65" }
genet-scripted-dom = "0.1.2"
# The shared frozen reader: the no-script reading lists the proof's fold as
# its group (site canvas plan, S5). Native only; the graph Wasm does not link it.
graphshell-client = { git = "https://github.com/merely-made/mere.git", rev = "17519aa4b76f9fa37577d1bb9cbfb46c6bf4ae65" }
layout-dom-api = "0.1.1"
mer3ly-radio-mirror = { path = "crates/radio-mirror" }
mer3ly-repo-graph = { path = "crates/repo-graph" }
regex = "1"
sceno = { git = "https://github.com/merely-made/mere.git", rev = "17519aa4b76f9fa37577d1bb9cbfb46c6bf4ae65" }
scenograph = { git = "https://github.com/merely-made/mere.git", rev = "17519aa4b76f9fa37577d1bb9cbfb46c6bf4ae65" }
scenomise = { git = "https://github.com/merely-made/mere.git", rev = "17519aa4b76f9fa37577d1bb9cbfb46c6bf4ae65" }
scenotime = { git = "https://github.com/merely-made/mere.git", rev = "17519aa4b76f9fa37577d1bb9cbfb46c6bf4ae65" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
# The m5 payload bounds are stated in gzip bytes, what a visitor downloads.
flate2 = "1.1.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
