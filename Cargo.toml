[package]
name = "mer3ly-site"
version = "0.1.0"
edition = "2024"

rust-version = "1.97.1"
publish = false
description = "Static Mer3ly site builder and public repository authority."
repository = "https://github.com/merely-made/merelyllc.com"
license = "MPL-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "authority"
path = "src/bin/authority.rs"

[[bin]]
name = "site"
path = "src/main.rs"

[dependencies]
cambium = "0.6.0"
# The /repos/ frozen first view (Ruling 157): the default matrix through the
# shared two-reading-matrix adapter (S2), and the default reading's capture
# decoded for the frozen reader. Native only, as graphshell-client is.
cartography = { package = "mere-cartography", git = "https://www.github.com/merely-made/mere.git", rev = "a6d44855b24de92ef060e16059cdacbe95135a19" }
chirograph = { git = "https://www.github.com/merely-made/mere.git", rev = "a6d44855b24de92ef060e16059cdacbe95135a19" }
genet-scripted-dom = "0.1.2"
# The shared frozen reader: the no-script reading lists the proof's fold as
# its group (site canvas plan, S5). Native only; the graph Wasm does not link it.
graphshell-client = { git = "https://www.github.com/merely-made/mere.git", rev = "a6d44855b24de92ef060e16059cdacbe95135a19" }
layout-dom-api = "0.1.1"
mer3ly-radio-mirror = { path = "crates/radio-mirror" }
mer3ly-repo-graph = { path = "crates/repo-graph" }
regex = "1"
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "a6d44855b24de92ef060e16059cdacbe95135a19" }
scenograph = { git = "https://www.github.com/merely-made/mere.git", rev = "a6d44855b24de92ef060e16059cdacbe95135a19" }
scenomise = { git = "https://www.github.com/merely-made/mere.git", rev = "a6d44855b24de92ef060e16059cdacbe95135a19" }
scenotime = { git = "https://www.github.com/merely-made/mere.git", rev = "a6d44855b24de92ef060e16059cdacbe95135a19" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
# The m5 payload bounds are stated in gzip bytes, what a visitor downloads.
flate2 = "1.1.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

