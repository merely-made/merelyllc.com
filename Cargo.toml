[package]
name = "mer3ly-site"
version = "0.1.0"
edition = "2024"

rust-version = "1.97.1"
publish = false
description = "Static Mer3ly site builder and public repository authority."
repository = "https://github.com/merely-made/merelyllc.com"
license = "MPL-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "authority"
path = "src/bin/authority.rs"

[[bin]]
name = "site"
path = "src/main.rs"

[dependencies]
cambium = "0.6.0"
# The /repos/ frozen first view (Ruling 157): the default matrix through the
# shared two-reading-matrix adapter (S2), and the default reading's capture
# decoded for the frozen reader. Native only, as graphshell-client is.
cartography = { package = "mere-cartography", git = "https://github.com/merely-made/mere.git", branch = "main" }
chirograph = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
genet-scripted-dom = "0.1.2"
# The shared frozen reader: the no-script reading lists the proof's fold as
# its group (site canvas plan, S5). Native only; the graph Wasm does not link it.
graphshell-client = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
layout-dom-api = "0.1.1"
mer3ly-radio-mirror = { path = "crates/radio-mirror" }
mer3ly-repo-graph = { path = "crates/repo-graph" }
regex = "1"
sceno = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenograph = { git = "https://github.com/merely-made/mere.git", branch = "main" }
scenomise = { git = "https://github.com/merely-made/mere.git", branch = "main" }
scenotime = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
# The m5 payload bounds are stated in gzip bytes, what a visitor downloads.
flate2 = "1.1.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

# Root patches are not inherited from the imported Murm suppliers.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[patch."https://github.com/merely-made/mere.git"]
# Promoted sources shared with immutable older Mere suppliers.
chartulary = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
armillary = { git = "https://github.com/merely-made/armillary.git", branch = "main" }

[patch.crates-io]
# Producer contracts use the same Mere source as the host.
sceno = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenotime = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenograph = { git = "https://github.com/merely-made/mere.git", branch = "main" }
scenomise = { git = "https://github.com/merely-made/mere.git", branch = "main" }
incipit = { git = "https://github.com/merely-made/mere.git", branch = "main" }
chirograph = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
mere-surface-api = { git = "https://github.com/merely-made/mere.git", branch = "main" }
workbench = { git = "https://github.com/merely-made/mere.git", branch = "main" }
hest = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
sprigging = { git = "https://github.com/merely-made/mere.git", branch = "main" }
# Promoted sources shared with immutable older Mere suppliers.
# Canonical promoted families; keep registry and Git consumers type-identical.
armillary = { git = "https://github.com/merely-made/armillary.git", branch = "main" }
chartulary = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.2" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.1" }
cambium = { git = "https://github.com/merely-made/mere.git", branch = "main" }
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
