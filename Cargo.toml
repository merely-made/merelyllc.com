[package]
name = "mer3ly-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Static Mer3ly site builder and public repository authority."
repository = "https://github.com/merely-made/merelyllc.com"
license = "MPL-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "authority"
path = "src/bin/authority.rs"

[[bin]]
name = "site"
path = "src/main.rs"

[dependencies]
cambium = "0.3.2"
genet-scripted-dom = "0.1.0"
layout-dom-api = "0.1.0"
mer3ly-radio-mirror = { path = "crates/radio-mirror" }
mer3ly-repo-graph = { path = "crates/repo-graph" }
regex = "1"
sceno = { git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3" }
scenograph = { git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3" }
scenomise = { git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
