# mere/design_docs/mere_docs/implementation_strategy/2026-10-30_house_style_plan.md
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: line-ceiling
        name: line ceiling
        entry: line-ceiling
        language: rust
        types: [text]
        always_run: true
        additional_dependencies: ["cli:https://github.com/merely-made/eidetic:line-ceiling-v0.0.2:line-ceiling"]
      - id: clippy
        name: clippy
        entry: cargo clippy --locked --all-targets
        language: system
        files: '(^|/)(Cargo\.(toml|lock)|[^/]+\.rs)$'
        pass_filenames: false
      - id: clippy-repo-graph
        name: clippy repo graph
        entry: cargo clippy --manifest-path crates/repo-graph/Cargo.toml --locked --all-targets
        language: system
        files: '^(crates/repo-graph/.*\.(rs|toml|lock)|Cargo\.(toml|lock))$'
        pass_filenames: false
      - id: clippy-radio-mirror
        name: clippy radio mirror
        entry: cargo clippy --manifest-path crates/radio-mirror/Cargo.toml --locked --all-targets
        language: system
        files: '^(crates/radio-mirror/.*\.(rs|toml|lock)|Cargo\.(toml|lock))$'
        pass_filenames: false
