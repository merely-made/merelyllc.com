[workspace]
resolver = "2"

[package]
name = "mer3ly-repo-graph"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Mer3ly repository authority adapters for Mere arrangements and portable Scenograph scenes."
repository = "https://github.com/merely-made/mer3ly-net"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arrangements = { git = "https://github.com/merely-made/mere.git", rev = "546991d144591e605f7d8b35de2afc01b39a7242" }
cartography = { package = "mere-cartography", git = "https://github.com/merely-made/mere.git", rev = "546991d144591e605f7d8b35de2afc01b39a7242" }
euclid = { version = "0.22", features = ["serde"] }
sceno = { git = "https://github.com/merely-made/mere.git", rev = "546991d144591e605f7d8b35de2afc01b39a7242" }
scenomise = { git = "https://github.com/merely-made/mere.git", rev = "546991d144591e605f7d8b35de2afc01b39a7242" }
scenotime = { git = "https://github.com/merely-made/mere.git", rev = "546991d144591e605f7d8b35de2afc01b39a7242" }
seiche = { git = "https://github.com/merely-made/mere.git", rev = "546991d144591e605f7d8b35de2afc01b39a7242" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["js"] }
wasm-bindgen = "=0.2.126"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
