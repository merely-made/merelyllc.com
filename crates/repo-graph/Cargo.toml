[workspace]
resolver = "2"

[package]
name = "mer3ly-repo-graph"
version = "0.1.0"
edition = "2024"

rust-version = "1.97.1"
publish = false
description = "Mer3ly repository authority adapters for Mere arrangements and portable sceno scenes."
repository = "https://github.com/merely-made/mer3ly-net"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cartography = { package = "mere-cartography", git = "https://www.github.com/merely-made/mere.git", rev = "9bba595c26a4a71ad6a4906bf1073b827f199721" }
chirograph = { git = "https://www.github.com/merely-made/mere.git", rev = "9bba595c26a4a71ad6a4906bf1073b827f199721" }
backstep = { git = "https://www.github.com/merely-made/mere.git", rev = "9bba595c26a4a71ad6a4906bf1073b827f199721" }
euclid = { version = "0.22", features = ["serde"] }
incipit = { git = "https://www.github.com/merely-made/mere.git", rev = "9bba595c26a4a71ad6a4906bf1073b827f199721" }
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "9bba595c26a4a71ad6a4906bf1073b827f199721" }
scenomise = { git = "https://www.github.com/merely-made/mere.git", rev = "9bba595c26a4a71ad6a4906bf1073b827f199721" }
scenotime = { git = "https://www.github.com/merely-made/mere.git", rev = "9bba595c26a4a71ad6a4906bf1073b827f199721" }
seiche = { git = "https://www.github.com/merely-made/mere.git", rev = "9bba595c26a4a71ad6a4906bf1073b827f199721" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["js"] }
wasm-bindgen = "=0.2.129"

[dev-dependencies]
graphshell-host = { git = "https://www.github.com/merely-made/mere.git", rev = "9bba595c26a4a71ad6a4906bf1073b827f199721", features = ["native"] }
graphshell-client = { git = "https://www.github.com/merely-made/mere.git", rev = "9bba595c26a4a71ad6a4906bf1073b827f199721" }
graphshell-endpoint = { git = "https://www.github.com/merely-made/mere.git", rev = "9bba595c26a4a71ad6a4906bf1073b827f199721", features = ["local"] }
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
notochord = { git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["tokio"] }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
transport = { package = "mere-transport", git = "https://github.com/merely-made/murm.git", branch = "main", features = ["notochord"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

# Measured 2026-10-08 with the projection session (site canvas plan, Ruling
# 140): against "s" with thin LTO, "z" with fat LTO cuts the graph Wasm from
# 1,530,360 B (503,449 B gzip, 378,279 B brotli) to 1,363,161 B (430,962 B gzip,
# 337,563 B brotli). Seiche ticks measured about 0.065 ms against 0.043 ms in a
# browser, well inside a frame. wasm-opt shrinks raw bytes but grows both
# compressed sizes, so it stays out.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

# Cargo does not carry Mere's own `[patch.crates-io]` across a git dependency,
# so the entries this graph's resolve reaches are repeated here, byte for byte
# with Mere's root manifest at the pinned revision.
[patch.crates-io]
