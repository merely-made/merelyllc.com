[workspace]
resolver = "2"

[package]
name = "mer3ly-repo-graph"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Mer3ly repository authority adapters for Mere arrangements and portable sceno scenes."
repository = "https://github.com/merely-made/mer3ly-net"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cartography = { package = "mere-cartography", git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3" }
chirograph = { git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3" }
edit-history = { git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3" }
euclid = { version = "0.22", features = ["serde"] }
incipit = { git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3" }
sceno = { git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3" }
scenomise = { git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3" }
scenotime = { git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3" }
seiche = { git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["js"] }
wasm-bindgen = "=0.2.129"

[dev-dependencies]
graphshell = { git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3" }
graphshell-client = { git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3" }
graphshell-endpoint = { git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3", features = ["local"] }
insigne = { git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3" }
notochord = { git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3", features = ["tokio"] }
personae = { git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3", features = ["agent"] }
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
transport = { package = "mere-transport", git = "https://github.com/merely-made/mere.git", rev = "9ccd5f411fd7e8631caceff55dae727c2e35b7a3", features = ["notochord"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"

# Cargo does not carry Mere's own `[patch.crates-io]` across a git dependency,
# so the entries this graph's resolve reaches are repeated here, byte for byte
# with Mere's root manifest at the pinned revision.
[patch.crates-io]
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
swarm-discovery = { git = "https://github.com/mark-ik/swarm-discovery.git", branch = "mere", version = "=0.6.3" }
