[workspace]
resolver = "2"

[package]
name = "mer3ly-repo-graph"
version = "0.1.0"
edition = "2024"

rust-version = "1.97.1"
publish = false
description = "Mer3ly repository authority adapters for Mere arrangements and portable sceno scenes."
repository = "https://github.com/merely-made/mer3ly-net"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cartography = { package = "mere-cartography", git = "https://github.com/merely-made/mere.git", branch = "main" }
chirograph = { git = "https://github.com/merely-made/mere.git", branch = "main" }
backstep = { git = "https://github.com/merely-made/mere.git", branch = "main" }
euclid = { version = "0.22", features = ["serde"] }
incipit = { git = "https://github.com/merely-made/mere.git", branch = "main" }
sceno = { git = "https://github.com/merely-made/mere.git", branch = "main" }
scenomise = { git = "https://github.com/merely-made/mere.git", branch = "main" }
scenotime = { git = "https://github.com/merely-made/mere.git", branch = "main" }
seiche = { git = "https://github.com/merely-made/mere.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["js"] }
wasm-bindgen = "=0.2.129"

[dev-dependencies]
graphshell-host = { git = "https://github.com/merely-made/mere.git", branch = "main", features = ["native"] }
graphshell-client = { git = "https://github.com/merely-made/mere.git", branch = "main" }
graphshell-endpoint = { git = "https://github.com/merely-made/mere.git", branch = "main", features = ["local"] }
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
notochord = { git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["tokio"] }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
transport = { package = "mere-transport", git = "https://github.com/merely-made/murm.git", branch = "main", features = ["notochord"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

# Measured 2026-10-08 with the projection session (site canvas plan, Ruling
# 140): against "s" with thin LTO, "z" with fat LTO cuts the graph Wasm from
# 1,530,360 B (503,449 B gzip, 378,279 B brotli) to 1,363,161 B (430,962 B gzip,
# 337,563 B brotli). Seiche ticks measured about 0.065 ms against 0.043 ms in a
# browser, well inside a frame. wasm-opt shrinks raw bytes but grows both
# compressed sizes, so it stays out.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

# Cargo does not carry Mere's own `[patch.crates-io]` across a git dependency,
# so the entries this graph's resolve reaches are repeated here, byte for byte
# with Mere's root manifest at the pinned revision.
[patch.crates-io]
# Producer contracts use the same Mere source as the host.
sceno = { git = "https://github.com/merely-made/mere.git", branch = "main" }
scenotime = { git = "https://github.com/merely-made/mere.git", branch = "main" }
scenograph = { git = "https://github.com/merely-made/mere.git", branch = "main" }
scenomise = { git = "https://github.com/merely-made/mere.git", branch = "main" }
graphshell-endpoint = { git = "https://github.com/merely-made/mere.git", branch = "main" }
incipit = { git = "https://github.com/merely-made/mere.git", branch = "main" }
chirograph = { git = "https://github.com/merely-made/mere.git", branch = "main" }
mere-surface-api = { git = "https://github.com/merely-made/mere.git", branch = "main" }
workbench = { git = "https://github.com/merely-made/mere.git", branch = "main" }
hest = { git = "https://github.com/merely-made/mere.git", branch = "main" }
sprigging = { git = "https://github.com/merely-made/mere.git", branch = "main" }
script-wire = { git = "https://github.com/merely-made/mere.git", branch = "main" }
script-witgen = { git = "https://github.com/merely-made/mere.git", branch = "main" }
# Promoted sources shared with immutable older Mere suppliers.
commons-spine = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
dict-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
errand = { git = "https://github.com/merely-made/errand.git", branch = "main" }
finger-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
fsp-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
gemini-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
gemot = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
gopher-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
guppy-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
kepler-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
mien = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
misfin = { git = "https://github.com/merely-made/errand.git", branch = "main" }
moothold = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
mooting = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
nex-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
scorpion-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
scroll-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
spartan-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
text-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
# Canonical promoted families; keep registry and Git consumers type-identical.
armillary = { git = "https://github.com/merely-made/armillary.git", branch = "main" }
chartulary = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
esp = { git = "https://github.com/merely-made/distillery.git", branch = "main" }
hagiograph = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
luggage = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
servitor = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
stickleback = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
netrender_device = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_shaders = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.2" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.1" }
cambium = { git = "https://github.com/merely-made/mere.git", branch = "main" }
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
mere-proofs = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }

