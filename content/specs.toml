# Family spec registry: every external specification a merely-made repository
# implements, depends on or should follow, as spec rows and per-repository claims.
# Rules and grammar: docs/2026-10-18_family_spec_registry_plan.md.
# Seeded 2026-10-18 from the spec atlas, genet's standards-to-features ledger,
# mere's standards survey and mere's W3C review; edited by hand from here.
# repo = "family" marks a family-wide verdict with no single consumer.

schema = "mer3ly.spec-registry/v1"

# Repositories whose scope is a whole catalog: catalog specs without a claim are
# reported as unclaimed rather than listed here.
