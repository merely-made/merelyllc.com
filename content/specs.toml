[[claim]]
spec = "nym"
repo = "family"
relation = "should"
depth = "none"
verdict = "WATCH"
evidence = "None today; row hand-added 2026-09-01. Could only be a fourth control-plane privacy lane beside emissary (reachability rungs plan R3): five hops (entry gateway, three mix layers, exit gateway), roughly half a second of exponential delay per mix hop, constant loop cover traffic. Not a rendezvous rung: a Nym address is `identity.encryption@gateway`, location-bearing and distributed out of band, with no netDB equivalent, so it carries only to a peer whose address you already hold. Bandwidth is metered at the gateway by zk-nym credentials paid in NYM, crypto or fiat; the docs' \"SDK integrations currently connect to the Mixnet without requiring credentials\" is a present exemption, not a promise. The entry gateway sees the client IP. Over I2P it adds only global-passive-adversary timing resistance, at the price of token-gated bandwidth and a dependence on Nym's economy. Revisit when a consumer's threat model names timing correlation."
source = "mere-survey-2026-08-24#7.110"
verified_on = "2026-08-24"

