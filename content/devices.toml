schema = "mer3ly.device-catalog/v2"

[[device]]
id = "v4-desktop-radio"
order = 1
name = "V4 desktop radio"
role = "A desk radio with its own status face"
summary = "A Heltec V4.2 board-level specimen with a proven local display, physical control, Reticulum carriage, and a stock-compatible RNode channel."
status = "development-specimen"
form = "desktop radio"
board = "Heltec WiFi LoRa 32 V4.2"
processor = "ESP32-S3"
radio = "SX1262"
interaction = "Built-in 128 x 64 OLED, one user button, and status LED"
power = "USB bench power was used for the receipts; battery and off-grid runtime are not qualified"
antenna = "A complete antenna recipe and placement receipt are still open"
enclosure = "No Merely enclosure file or mechanical receipt is approved"
recipe_state = "Board-level development specimen. The published firmware ledger below records the exact V4 installation and recovery evidence; enclosure, power, antenna, and assembled-product work remain open."
source_repository = "https://github.com/merely-made/retinue"
source_document = "design_docs/2026-07-31_retinue_small_plan.md"

[device.authorization]
state = "open"
device = "The exact equipment grant, grantee record, and conditions for this board revision have not yet been accepted into the catalog."
antenna = "The authorized antenna set, connector path, placement, and labeling conditions remain to be documented."
operating_envelope = "Retinue enforces selected regional frequency and power limits; each alternate firmware image must carry limits appropriate to this exact hardware."
note = "Protocol support and software licensing do not replace equipment authorization. The authorization record must be reviewed before sale."

[device.sale]
state = "not-offered"
note = "This development specimen has no purchase link. Sale waits for a complete recipe, assembled-product testing, and a reviewed authorization record."

[[device.network_support]]
name = "Reticulum"
state = "demonstrated"
note = "Real RNS 1.4.0 configures and powers the V4 RNode channel, while reference Reticulum and the Rust stack validate one another over real RF."

[[device.network_support]]
name = "Meshtastic"
state = "demonstrated"
note = "Sennet text transmitted through V4 direct-PHY firmware was accepted, decrypted, and rebroadcast by a stock Meshtastic node."

[[device.network_support]]
name = "MeshCore"
state = "demonstrated"
note = "Tucket exchanged authenticated adverts, encrypted text, acknowledgements, and reciprocal routes with official MeshCore companion firmware."

[[device.flash_recipe]]
package_id = "retinue.heltec-v4"
name = "Retinue radio image"

[[device.flash_recipe]]
package_id = "prns.hopspot.heltec-v4"
name = "Prns Hopspot"

[[device.evidence]]
label = "On-device status face"
state = "proven"
note = "The fitted OLED, short press, long press, menu, display-off path, and consumed wake press passed physical acceptance."

[[device.evidence]]
label = "Bidirectional Reticulum carriage"
state = "proven"
note = "The image exchanged a byte-exact 4 KiB Reticulum Resource in both directions against the T114 while the UI remained active."

[[device.evidence]]
label = "Owner installation"
state = "proven"
note = "The published V4 ledger retains installer and recovery receipts for the public cabled route. Firmware proof does not complete the enclosure, power, antenna, or sale recipe."

[[device.open_requirement]]
label = "Printed enclosure"
note = "Publish the source file, print settings, fasteners, port clearances, thermal observations, and an assembly receipt."

[[device.open_requirement]]
label = "Power assembly"
note = "Select and test the battery, protection, charging path, connector, runtime, and replacement instructions."

[[device.open_requirement]]
label = "Antenna assembly"
note = "Name the exact antenna and connector path, then record placement, strain relief, and RF acceptance."

[[device.open_requirement]]
label = "Sale readiness"
note = "Complete the authorization record, labeling, instructions, supplier traceability, product safety work, and assembled-product review before enabling purchase."

