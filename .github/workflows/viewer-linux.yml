name: Diagnose viewer Linux rendering
on:
  push:
    branches: [codex/site-viewer-linux]
    paths:
      - '.github/workflows/viewer-linux.yml'
      - 'scripts/*viewer*.mjs'
      - 'scripts/browser-launch.mjs'
      - 'tests/fixtures/viewer-linux/**'
      - 'tests/fixtures/viewer-site-20261027/**'
      - 'scripts/prepare-viewer-linux.py'
      - 'assets/graphshell/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Prepare source-bound regression and product pages
        run: python3 scripts/prepare-viewer-linux.py
      - run: xvfb-run --auto-servernum node scripts/diagnose-viewer-quality.mjs
      - run: xvfb-run --auto-servernum node scripts/diagnose-viewer-capture.mjs
        env:
          DEBUG: pw:browser
          MER3LY_VIEWER_FIXTURE_DIR: .tmp/viewer-current-site
          MER3LY_VIEWER_FIXTURE_LABEL: site page built from b799b481; exact inputs in product-source-binding.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: viewer-linux-${{ github.sha }}
          path: .tmp/viewer-linux/
          include-hidden-files: true
