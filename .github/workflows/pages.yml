name: Build and deploy public site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "CNAME"
      - "assets/**"
      - "content/**"
      - "crates/repo-graph/**"
      - "ops/org-migration.toml"
      - "package-lock.json"
      - "package.json"
      - "rust-toolchain.toml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate, build, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    env:
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}
      MER3LY_SITE_DIR: .tmp/pages-artifact
      MER3LY_RECEIPT_DIR: .tmp/m9-headed
      MER3LY_HEADLESS: "false"
    steps:
      - name: Check out the pinned source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown

      - name: Install locked build dependencies
        run: |
          npm ci --ignore-scripts
          cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Validate the committed authority
        run: cargo run --locked --bin authority -- validate

      - name: Refresh reduced public GitHub metadata
        shell: pwsh
        run: ./scripts/refresh-public-metadata.ps1

      - name: Validate refreshed public metadata
        run: cargo run --locked --bin authority -- validate-metadata

      - name: Verify Rust source and behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all -- --check
          cargo fmt --manifest-path crates/repo-graph/Cargo.toml -- --check
          cargo test --locked
          cargo test --manifest-path crates/repo-graph/Cargo.toml --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --manifest-path crates/repo-graph/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build the reproducible pinned Mere graph runtime
        shell: pwsh
        run: |
          ./scripts/build-repo-graph.ps1 -KeepTarget
          $firstJs = (Get-FileHash assets/mer3ly_repo_graph.js -Algorithm SHA256).Hash
          $firstWasm = (Get-FileHash assets/mer3ly_repo_graph_bg.wasm -Algorithm SHA256).Hash
          ./scripts/build-repo-graph.ps1
          $secondJs = (Get-FileHash assets/mer3ly_repo_graph.js -Algorithm SHA256).Hash
          $secondWasm = (Get-FileHash assets/mer3ly_repo_graph_bg.wasm -Algorithm SHA256).Hash
          if ($firstJs -ne $secondJs -or $firstWasm -ne $secondWasm) {
            throw "repository graph output is not reproducible on the deployment host"
          }

      - name: Build and validate the exact Pages artifact
        shell: pwsh
        run: |
          $artifact = ".tmp/pages-artifact"
          cargo run --locked --bin site -- --output $artifact
          if ($LASTEXITCODE -ne 0) {
            throw "static site build failed"
          }
          $receipt = cargo run --quiet --locked --bin authority -- validate-artifact "." $artifact
          if ($LASTEXITCODE -ne 0) {
            throw "public artifact validation failed"
          }
          Set-Content -LiteralPath ".tmp/m9-static-receipt.json" -Value $receipt -Encoding utf8
          $projectionReceipt = cargo run --quiet --manifest-path crates/repo-graph/Cargo.toml --locked --bin projection-receipt -- "$artifact/projection-scene.json"
          if ($LASTEXITCODE -ne 0) {
            throw "native Scenograph projection consumer failed"
          }
          Set-Content -LiteralPath ".tmp/m9-projection-receipt.json" -Value $projectionReceipt -Encoding utf8

      - name: Install headed-smoke browser
        run: npx playwright install --with-deps chromium

      - name: Run headed discovery, metadata, showcase, project, graph, mobile, and fallback smoke
        run: xvfb-run --auto-servernum npm run smoke

      - name: Upload acceptance receipts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m9-acceptance-${{ github.sha }}
          path: |
            content/github-metadata.json
            .tmp/m9-static-receipt.json
            .tmp/m9-projection-receipt.json
            .tmp/m9-headed/
          if-no-files-found: warn
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the exact checked Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .tmp/pages-artifact

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
